#############################################################
# SINGLE PARTICLE PARAMETERS INPUT FILE
#############################################################

# Initialise particle and set material parameters
particle:
  initial:
    n_Fe: 8             # initial number of Fe atoms in the nucleus
    n_O: 0              # initial number of O atoms in the 
    T_p: auto           # or numeric value
    metal_spec: 'FE'    # name of the metallic species (FE)
  material:
    rho_fe: 7800.0      # Fe density (kg/m^3)
    rho_fe2o3: 5400.0   # Fe2O3 density (linear interpolation of particle density vs. oxidation level) (kg/m^3)
    pST_max: 1.5        # maximum O/Fe ratio (max. [p]article [ST]oichiometry)
    C_p: 400.0          # Specific heat capacity of the particle (kJ/mol)
    epsilon_p: 4.0e-8   # Particle emissivity

# Nucleation gas reservoir properties
nucleation:
  mode: add             # 2 modes available: add (adds all defined species x factors), decomp (takes the precursor decomposition minus selected removed species)
  # Add mode config
  added_species: 
    - name: FE          # Take into account this species to Fe gas pool
      factor: 1         # Number of Fe atoms 
    - name: FE2         # etc.
      factor: 2
    - name: FE3
      factor: 3
    - name: FE4
      factor: 4
    - name: FE5
      factor: 5
    - name: FE6
      factor: 6
    - name: FE7
      factor: 7
  # Remove mode config
  precursor: FEC5O5     # Decomposition of this species will create the Fe gas pool (all Fe will come from decomposed IPC)
  removed_species:
    - name: FE2O3(s)    # Remove Fe contained within this species from the Fe pool
      factor: 2         # 2 Fe atoms 

# Fe evaporation data
evaporation:
  H_evap: -550000.0     # heat change due to evaporation (J/mol)
  A_evap: 4.9e5         # Arrh. fit preexponential factor 
  T_Aevap: 19500.0      # Arrh. fit activation temperature
  relax: 0.1            # Evaporation relaxation factor 

# Collisions (elastic and inelastic)
collisions:

  # Fe adhesion
  # Fe[x]O[y](p) + Fe(g) => Fe[x+1]O[y](p)
  - name: Fe           # incident species name
    shape: 0           # no. of rotational DoF -1 (0: monatomic (1 rotational DoF))
    T_a: 0.0           # Activation temperature (K)
    Hr: 120000.0       # Enthalpy change (J/mol) 
    type: stick        # collision type: stick (molecule always adheres to the particle) 
    star: n            # collision type symbol (n: nucleation (heterogenous))
    addO: 0            # collision outcome: no. of oxygen atoms added to the particle
    addFE: 1           # collision outcome: no. of Fe atoms added to the particle

  # O2 oxidation
  # Fe[x]O[y](p) + O2(g) => Fe[x]O[y+1](p) (+ O(g))
  - name: O2           # incident species name
    shape: 1           # no. of rotational DoF -1 (1: linear (2 rotational DoF))
    T_a: 1000.0        # Activation temperature (K)
    Hr: 160000.0       # Enthalpy change (J/mol) 
    type: oxi          # collision type: oxi (reacts with available Fe at the part. surface)
    star: o            # collision type symbol (o: oxidation)
    addO: 1            # collision outcome: no. of oxygen atoms added to the particle 
    addFE: 0           # collision outcome: no. of Fe atoms added to the particle

  # O oxidation
  # Fe[x]O[y](p) + O(g) => Fe[x]O[y+1](p)
  - name: O            # incident species name
    shape: 0           # no. of rotational DoF -1 (0: monatomic (1 rotational DoF))
    T_a: 0.0           # Activation temperature (K)
    Hr: 658000.0       # Enthalpy change (J/mol) 
    type: oxi          # collision type: oxi (reacts with available Fe at the part. surface)
    star: o            # collision type symbol (o: oxidation)
    addO: 1            # collision outcome: no. of oxygen atoms added to the particle 
    addFE: 0           # collision outcome: no. of Fe atoms added to the particle

  # H2O oxidation
  # Fe[x]O[y](p) + H2O(g) => Fe[x]O[y+1](p) (+ OH(g))
  - name: H2O          # incident species name
    shape: 2           # no. of rotational DoF -1 (2: triatomic bent (3 rotational DoF))
    T_a: 1300.0        # Activation temperature (K)
    Hr: 87000.0        # Enthalpy change (J/mol) 
    type: oxi          # reaction type: oxi (reacts with available Fe at the part. surface) 
    star: o            # reaction type symbol (o: oxidation)
    addO: 1            # reac. outcome: no. of oxygen atoms added to the particle
    addFE: 0           # reac. outcome: no. of Fe atoms added to the particle

  # H2 reduction
  # Fe[x]O[y](p) + H2(g) => Fe[x]O[y-1](p) (+ H2O(g))
  - name: H2           # incident species name
    shape: 1           # no. of rotational DoF -1 (1: linear (2 rotational DoF))
    T_a: 2000.0        # Activation temperature (K)
    Hr: 52000.0        # Enthalpy change (J/mol) 
    type: red          # collision type: red (reacts with available O at the part. surface)
    start: r           # collision type symbol (r: reduction)
    addO: -1           # collision outcome: no. of oxygen atoms added to the particle 
    addFE: 0           # collision outcome: no. of Fe atoms added to the particle

  # H reduction
  # Fe[x]O[y](p) + H(g) => Fe[x]O[y-1](p) (+ OH(g))
  - name: H            # incident species name
    shape: 0           # no. of rotational DoF -1 (0: monatomic (1 rotational DoF))
    T_a: 500.0         # Activation temperature (K)
    Hr: 53000.0        # Enthalpy change (J/mol) 
    type: red          # collision type: red (reacts with available O at the part. surface)
    star: r            # collision type symbol (r: oxidation)
    addO: -1           # collision outcome: no. of oxygen atoms added to the particle 
    addFE: 0           # collision outcome: no. of Fe atoms added to the particle

  # OH etching
  # Fe[x]O[y](p) + OH(g) => Fe[x-1]O[y](p) (+ FeOH(g))
  - name: OH           # incident species name
    shape: 1           # no. of rotational DoF -1 (1: linear (2 rotational DoF))
    T_a: 2200.0        # Activation temperature (K)
    Hr: 157000.0       # Enthalpy change (J/mol) 
    type: etch         # collision type: etch (reacts with Fe at the part. surface)
    star: et           # collision type symbol (et: etching)
    addO: 0            # collision outcome: no. of oxygen atoms added to the particle 
    addFE: -1          # collision outcome: no. of Fe atoms added to the particle

  # AR elastic
  # Fe[x]O[y](p) + Ar(g) => Fe[x]O[y](p) (+ AR(g))
  - name: AR           # incident species name
    shape: 0           # no. of rotational DoF -1 (0: monatomic (1 rotational DoF))
    T_a: 1e30          # Activation temperature (K)
    Hr: 0.0            # Enthalpy change (J/mol) 
    type: elastic      # reaction type: elastic (no adhesion to the particle) 
    star: el           # reaction type symbol (el: elastic)
    addO: 0            # reac. outcome: no. of oxygen atoms added to the particle
    addFE: 0           # reac. outcome: no. of Fe atoms added to the particle

MC_params:
  z_max: auto           # maximum DFB
  MBD_points: 2000      # Maxwell-Boltzmann distribution resolution
  MBD_width: 4.0        # MB distribution width (multiples of mean molecule velocity)
  MBD_deltaT: 5.0       # max. temperature deviation from new MBD calculation
  elastic_accommodation: 1.0
